name: Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/review"
          claude_args: "--max-turns 5"

      - name: Comment on PR with Claude Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GTTOKEN }}
          script: |
            const review = process.env.CLAUDE_OUTPUT || `${{ steps.claude.outputs.output }}` || "";
            if (!review || review.trim() === "") {
              core.warning("Claude returned no review");
            } else {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `### 🤖 Claude Code Review\n${review}`
              });
            }
        env:
          CLAUDE_OUTPUT: ${{ steps.claude.outputs.output }}
